<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? | 점심 메뉴 추천</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: #f7f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            font-size: 28px;
            color: #ff6b6b;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 15px;
            color: #666;
            margin-bottom: 25px;
        }

        .category-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .category-btn {
            border: 1px solid #ddd;
            background-color: #fff;
            color: #555;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .category-btn.active, .category-btn:hover {
            background-color: #ff6b6b;
            color: #fff;
            border-color: #ff6b6b;
        }

        .result-box {
            background-color: #fff5f5;
            border: 2px dashed #ff8e8e;
            border-radius: 15px;
            padding: 35px 20px;
            margin-bottom: 25px;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .menu-name {
            font-size: 32px;
            font-weight: bold;
            color: #222;
            margin-bottom: 8px;
            word-break: keep-all;
        }

        .menu-category {
            font-size: 14px;
            color: #888;
            background: #fff;
            padding: 3px 10px;
            border-radius: 10px;
        }

        .recommend-btn {
            width: 100%;
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
            transition: background-color 0.2s, transform 0.1s;
        }

        .recommend-btn:hover {
            background-color: #ee5253;
        }

        .recommend-btn:active {
            transform: scale(0.98);
        }

        /* 룰렛처럼 도는 애니메이션 효과 */
        .spinning {
            animation: pulse 0.1s infinite alternate;
            opacity: 0.6;
        }

        @keyframes pulse {
            from { transform: scale(0.98); }
            to { transform: scale(1.02); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍱 오늘 뭐 먹지?</h1>
        <p class="subtitle">점심 메뉴 고민, 버튼 하나로 해결하세요!</p>

        <!-- 카테고리 선택 버튼 -->
        <div class="category-group">
            <button class="category-btn active" onclick="setCategory('전체', this)">전체</button>
            <button class="category-btn" onclick="setCategory('한식', this)">한식</button>
            <button class="category-btn" onclick="setCategory('중식', this)">중식</button>
            <button class="category-btn" onclick="setCategory('일식', this)">일식</button>
            <button class="category-btn" onclick="setCategory('양식', this)">양식</button>
            <button class="category-btn" onclick="setCategory('기타', this)">기타</button>
        </div>

        <!-- 결과 출력 창 -->
        <div class="result-box">
            <div id="menu-display" class="menu-name">버튼을 눌러보세요!</div>
            <div id="category-display" class="menu-category" style="display: none;"></div>
        </div>

        <!-- 추천 버튼 -->
        <button class="recommend-btn" onclick="recommendMenu()">점심 메뉴 추천받기 🎲</button>
    </div>

    <script>
        // 메뉴 데이터 베이스
        const menuList = [
            // 한식
            { name: "김치찌개", category: "한식" },
            { name: "된장찌개", category: "한식" },
            { name: "제육볶음", category: "한식" },
            { name: "비빔밥", category: "한식" },
            { name: "순대국", category: "한식" },
            { name: "부대찌개", category: "한식" },
            { name: "설렁탕", category: "한식" },
            { name: "불고기덮밥", category: "한식" },
            
            // 중식
            { name: "짜장면", category: "중식" },
            { name: "짬뽕", category: "중식" },
            { name: "볶음밥", category: "중식" },
            { name: "마라탕", category: "중식" },
            { name: "탕수육 + 정식", category: "중식" },

            // 일식
            { name: "돈까스", category: "일식" },
            { name: "초밥", category: "일식" },
            { name: "라멘", category: "일식" },
            { name: "가츠동 (덮밥)", category: "일식" },
            { name: "우동", category: "일식" },

            // 양식
            { name: "파스타", category: "양식" },
            { name: "수제버거", category: "양식" },
            { name: "피자", category: "양식" },
            { name: "스테이크 덮밥", category: "양식" },

            // 기타 (분식/패스트푸드 등)
            { name: "떡볶이 & 튀김", category: "기타" },
            { name: "샌드위치 & 샐러드", category: "기타" },
            { name: "쌀국수", category: "기타" },
            { name: "카레라이스", category: "기타" }
        ];

        let selectedCategory = "전체";
        let isSpinning = false;

        // 카테고리 변경 함수
        function setCategory(category, element) {
            if (isSpinning) return;
            
            selectedCategory = category;
            
            // 버튼 스타일 업데이트
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        // 메뉴 추천 함수 (랜덤 & 룰렛 효과)
        function recommendMenu() {
            if (isSpinning) return;

            // 선택된 카테고리에 맞는 메뉴만 필터링
            const filteredMenus = selectedCategory === "전체" 
                ? menuList 
                : menuList.filter(item => item.category === selectedCategory);

            if (filteredMenus.length === 0) {
                alert("해당 카테고리에 메뉴가 없습니다.");
                return;
            }

            const menuDisplay = document.getElementById("menu-display");
            const categoryDisplay = document.getElementById("category-display");
            
            isSpinning = true;
            menuDisplay.classList.add("spinning");
            categoryDisplay.style.display = "none";

            // 랜덤으로 텍스트가 빠르게 바뀌는 효과
            let counter = 0;
            const interval = setInterval(() => {
                const randomTemp = filteredMenus[Math.floor(Math.random() * filteredMenus.length)];
                menuDisplay.innerText = randomTemp.name;
                counter++;

                if (counter > 15) { // 1.5초 정도 후 멈춤
                    clearInterval(interval);
                    
                    // 최종 선택
                    const finalChoice = filteredMenus[Math.floor(Math.random() * filteredMenus.length)];
                    menuDisplay.innerText = finalChoice.name;
                    categoryDisplay.innerText = `#${finalChoice.category}`;
                    categoryDisplay.style.display = "inline-block";
                    
                    menuDisplay.classList.remove("spinning");
                    isSpinning = false;
                }
            }, 80);
        }
    </script>
</body>
</html>
